</style><rect x="0" y="0" width="1200" height="640" rx="0" class="bg"/><rect x="48" y="34" width="165" height="32" rx="16" class="pill"/><text x="130.5" y="55" class="tiny" text-anchor="middle">GUIA VISUAL · 05</text><text x="48" y="115" class="title" text-anchor="start">Superfície → hit test → reticle</text><text x="48" y="153" class="sub" text-anchor="start">O aplicativo recebe uma posição espacial e usa essa pose para colocar o vaso.</text><rect x="48" y="189" width="336" height="362" rx="18" class="card"/><text x="68" y="234" class="heading" text-anchor="start">1. Detectar região</text><polygon points="102,434 332,434 360,483 73,483" class="surface"/><rect x="167" y="261" width="95" height="162" rx="17" class="phone"/><rect x="176" y="275" width="77" height="134" rx="8" class="screen"/><rect x="205" y="268" width="20" height="4" rx="2" class="gray"/><circle cx="140" cy="444" r="8" class="point"/><circle cx="191" cy="462" r="8" class="point"/><circle cx="259" cy="449" r="8" class="point"/><circle cx="323" cy="465" r="8" class="point"/><text x="216" y="527" class="small" text-anchor="middle">Pontos sobre um plano</text><rect x="431" y="189" width="336" height="362" rx="18" class="card"/><text x="451" y="234" class="heading" text-anchor="start">2. Fazer hit test</text><polygon points="485,434 715,434 743,483 456,483" class="surface"/><rect x="550" y="261" width="95" height="162" rx="17" class="phone"/><rect x="559" y="275" width="77" height="134" rx="8" class="screen"/><rect x="588" y="268" width="20" height="4" rx="2" class="gray"/><path d="M599 422 L613 459" class="ray"/><circle cx="613" cy="459" r="10" class="green"/><text x="599" y="527" class="small" text-anchor="middle">Raio encontra geometria</text><rect x="814" y="189" width="336" height="362" rx="18" class="card"/><text x="834" y="234" class="heading" text-anchor="start">3. Posicionar peça</text><polygon points="868,434 1098,434 1126,483 839,483" class="surface"/><rect x="933" y="261" width="95" height="162" rx="17" class="phone"/><rect x="942" y="275" width="77" height="134" rx="8" class="screen"/><rect x="971" y="268" width="20" height="4" rx="2" class="gray"/><ellipse cx="995" cy="449" rx="35" ry="12" fill="none" stroke="#31865b" stroke-width="5"/><path d="M981.48 381.2 C986.68 392.64,987.2 395.76,980.96 408.24 Q971.6 432.68,995 433.2 Q1018.4 432.68,1009.04 408.24 C1002.8 395.76,1003.32 392.64,1008.52 381.2 Z" class="pot"/><ellipse cx="995" cy="381.2" rx="13.52" ry="4.16" class="rim"/><text x="982" y="527" class="small" text-anchor="middle">Reticle indica onde tocar</text><text x="48" y="610" class="foot" text-anchor="start">O fluxo mostrado já está implementado no AR Ceramic Designer.</text></svg>