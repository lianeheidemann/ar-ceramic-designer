<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Superfície → hit test → reticle"><defs><marker id="arrowhead" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#31865b" stroke-width="2"/></marker></defs><style>
