</style><rect x="0" y="0" width="1200" height="640" rx="0" class="bg"/><rect x="48" y="34" width="165" height="32" rx="16" class="pill"/><text x="130.5" y="55" class="tiny" text-anchor="middle">GUIA VISUAL · 04</text><text x="48" y="115" class="title" text-anchor="start">SLAM precisa de CNN e padding?</text><text x="48" y="153" class="sub" text-anchor="start">Não necessariamente. São técnicas diferentes que podem ser combinadas.</text><rect x="48" y="189" width="536" height="358" rx="18" class="panel"/><rect x="616" y="189" width="536" height="358" rx="18" class="bluepanel"/><rect x="74" y="210" width="224" height="32" rx="16" class="pill"/><text x="186" y="231" class="tiny" text-anchor="middle">MÉTODO CLÁSSICO</text><rect x="642" y="210" width="270" height="32" rx="16" class="pill"/><text x="777" y="231" class="tiny" text-anchor="middle">APRENDIZADO OPCIONAL</text><text x="80" y="293" class="heading" text-anchor="start">SLAM geométrico</text><text x="80" y="340" class="body" text-anchor="start">Identificação de pontos</text><text x="80" y="388" class="body" text-anchor="start">Correspondência entre quadros</text><text x="80" y="436" class="body" text-anchor="start">Geometria + otimização</text><text x="80" y="513" class="success" text-anchor="start">Pode funcionar sem redes neurais</text><text x="648" y="293" class="heading" text-anchor="start">Métodos aprendidos</text><text x="648" y="340" class="body" text-anchor="start">CNN pode extrair características</text><text x="648" y="388" class="body" text-anchor="start">Convolução aplica filtros</text><text x="648" y="436" class="body" text-anchor="start">Padding trata bordas dos dados</text><text x="648" y="513" class="success" text-anchor="start">Não é etapa obrigatória do SLAM</text><text x="48" y="610" class="foot" text-anchor="start">Não há treinamento de CNN no código do AR Ceramic Designer.</text></svg>